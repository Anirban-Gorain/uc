<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaakify | Grammar for real life</title>
    <link
      rel="icon"
      type="image/png"
      href="../../assets/static-images/favicon.png"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Link to your style file -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="text-slate-100 h-screen flex flex-col overflow-hidden">
    <!-- Top Area: Tracker and Title -->
    <header
      class="w-full px-6 py-4 lg:px-12 lg:py-4 flex flex-col lg:flex-row justify-between items-center bg-slate-900/80 border-b border-slate-800/80 shrink-0 gap-4 shadow-md z-20 backdrop-blur-md sticky top-0"
    >
      <!-- Vaakify Logo -->
      <div
        class="flex flex-col items-center lg:items-start text-center lg:text-left"
      >
        <span
          class="text-xs lg:text-sm font-bold tracking-widest uppercase text-orange-400"
          >Vaakify</span
        >
      </div>

      <!-- One-Row Progress Bar -->
      <div
        class="w-full lg:w-1/3 max-w-md bg-slate-800/40 border border-slate-700/60 px-5 py-3 rounded-2xl flex flex-row items-center gap-4 shadow-sm"
      >
        <span
          class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold whitespace-nowrap"
          >Progress</span
        >

        <div class="flex-1 h-2 bg-slate-900 rounded-full overflow-hidden">
          <div
            id="progress-fill"
            class="h-full bg-orange-500 w-0 rounded-full transition-all duration-700 ease-out"
          ></div>
        </div>

        <h2
          id="progress-text"
          class="text-2xl font-extrabold text-orange-400 tabular-nums leading-none w-14 text-right"
        >
          0%
        </h2>
      </div>
    </header>

    <!-- Main List Area -->
    <main
      class="flex-1 overflow-y-auto no-scrollbar relative w-full h-full bg-[#0d0a06]"
    >
      <div class="max-w-4xl mx-auto px-4 py-8 lg:px-8">
        <!-- NEW: The Big Thumbnail Image -->
        <img
          src="../../assets/static-images/grammar-list-thumbnail.png"
          alt="Grammar Thumbnail"
          class="w-full object-cover rounded-[2rem] shadow-xl border border-slate-700/50 mb-6 z-10 relative"
        />

        <!-- NEW: The missing thin title placed beautifully under the image -->
        <h1
          class="text-3xl lg:text-5xl font-light text-white tracking-wide mb-12 text-center lg:text-left z-10 relative"
        >
          Grammar for real life
        </h1>

        <!-- The List Box (This keeps the dashed line perfectly in place) -->
        <div class="relative">
          <!-- The Dashed Line (Math changed so it hits the center of every circle perfectly) -->
          <div
            class="absolute left-[19px] lg:left-[23px] top-6 bottom-6 w-0.5 border-l-2 border-dashed border-slate-700/50 z-0"
          ></div>

          <!-- This is where all the roadmap steps will be placed by Javascript -->
          <div id="roadmap-container" class="flex flex-col gap-8 relative z-10">
            <!-- Cards go here -->
          </div>
        </div>

        <div
          class="mt-20 mb-10 flex flex-col items-center justify-center text-center opacity-80"
        >
          <p
            class="font-['Caveat'] text-2xl lg:text-3xl text-slate-300 transform -rotate-2"
          >
            "Small steps every day build big confidence."
          </p>
        </div>
      </div>
    </main>

    <!-- Load Data first, then the Brain -->
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
